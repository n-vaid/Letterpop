<style>
:root{--bg:#F4EFE4;--ink:#1C1C2A;--line:rgba(28,28,42,.26)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;transition:background .35s}
body{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--ink);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:text;touch-action:manipulation}

/* header: credit on the left, instructions centred */
#top{position:fixed;top:calc(18px + env(safe-area-inset-top));left:24px;right:24px;display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:16px;font-size:12px;letter-spacing:.05em;pointer-events:none}
#credit{grid-column:1;grid-row:1;justify-self:start;opacity:.75;white-space:nowrap}
#credit a{color:inherit;pointer-events:auto;text-underline-offset:3px}
#tg{grid-column:3;grid-row:1;justify-self:end;color:inherit;opacity:.5;text-decoration:none;white-space:nowrap;pointer-events:auto}
#tg:hover{opacity:.9}
#hint{grid-column:2;grid-row:1;white-space:nowrap;opacity:.6;transition:opacity .4s}
#hint.quiet{opacity:.4}
#count{white-space:nowrap}
#count b{font-weight:inherit}
#count i{display:inline-block;width:6px;height:6px;margin:0 7px 1px 0;border-radius:50%;background:currentColor;animation:live 2.4s ease-in-out infinite}
@keyframes live{0%,100%{opacity:1}50%{opacity:.25}}
#hint .touch{display:none}
@media (pointer:coarse){#hint .fine{display:none}#hint .touch{display:inline}}
@media (max-width:1060px){
  #top{display:flex;flex-wrap:wrap;justify-content:center;column-gap:14px;row-gap:6px;left:12px;right:12px;text-align:center}
  #hint{order:3;flex-basis:100%;white-space:normal}
  #count{display:block;margin-top:6px}
  #count[hidden]{display:none}
  .csep{display:none}
}

#nudge{position:fixed;left:50%;top:50%;transform:translate(-50%,0);display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.08em;pointer-events:none;transition:opacity .3s}
#nudge.off{opacity:0}
.keycap{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:1px solid var(--ink);border-radius:7px;font-size:12px;box-shadow:0 3px 0 var(--line);animation:press 1.6s ease-in-out infinite}
@keyframes press{0%,55%,100%{transform:translateY(0);box-shadow:0 3px 0 var(--line)}65%,80%{transform:translateY(3px);box-shadow:0 0 0 var(--line)}}

/* dock: one slim outlined pill on wide screens */
#dock{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:5px 6px;border:1px solid var(--line);border-radius:999px;background:transparent;cursor:default}
.group{display:flex;align-items:center;gap:2px}
.tile{flex:none;width:46px;height:34px;padding:0;border:1px solid transparent;border-radius:999px;background:transparent;cursor:pointer;transition:border-color .2s}
.tile canvas{display:block;width:100%;height:100%;pointer-events:none}
.tile:hover{border-color:var(--line)}
.tile.on{border-color:var(--ink)}
.sw{flex:none;width:26px;height:26px;padding:4px;border:0;border-radius:50%;background:transparent;cursor:pointer;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s}
.sw span{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);transition:transform .2s}
.sw:hover span{transform:scale(1.1)}
.sw.on{box-shadow:inset 0 0 0 1.5px var(--ink)}
.sep{flex:none;width:1px;height:20px;background:var(--line)}
#save{flex:none;display:flex;align-items:center;gap:6px;height:34px;padding:0 13px 0 11px;border:1px solid transparent;border-radius:999px;background:transparent;color:var(--ink);font:500 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;cursor:pointer;transition:border-color .2s}
#save:hover{border-color:var(--ink)}
#save svg{width:16px;height:16px}
button:focus-visible{outline:1.5px solid var(--ink);outline-offset:2px}
#kb{position:fixed;left:0;top:0;width:1px;height:1px;margin:0;padding:0;border:0;opacity:0;font-size:16px;color:transparent;background:transparent;caret-color:transparent;pointer-events:none}

/* phones and narrow windows: two rows that always fit — styles on top, colours and save below */
@media (max-width:720px){
  #top{font-size:10.5px;letter-spacing:.03em}
  #dock{left:12px;right:12px;transform:none;bottom:calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto;grid-template-areas:"f f" "s v";row-gap:6px;column-gap:6px;padding:6px;border-radius:22px}
  .sep{display:none}
  #filters{grid-area:f;gap:2px}
  .tile{flex:1 1 0;min-width:0;width:auto;height:40px}
  #swatches{grid-area:s;justify-content:space-between;gap:0}
  .sw{flex:1 1 0;width:auto;height:auto;max-width:32px;aspect-ratio:1;padding:3px}
  #save{grid-area:v;height:32px;padding:0 10px;border-color:var(--line)}
}

<body>
<canvas id="cv" aria-label="Type canvas"></canvas>
<header id="top">
  <div id="credit">An exploration by <a href="https://navneetvaid.design" target="_blank" rel="noopener">Navneet Vaid</a></div>
  <a id="tg" href="https://type-garden.vercel.app" target="_blank" rel="noopener">inspired by Type Garden ↗</a>
  <div id="hint"><span class="fine">type anything · backspace to undo · enter to clear</span><span class="touch">tap to type · ⌫ to undo · return to clear</span><span id="count" hidden><span class="csep"> · </span><i></i><b></b></span></div>
</header>
<div id="nudge"><span class="keycap">A</span><span>start typing</span></div>
<input id="kb" aria-label="Type here" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false">
<div id="dock" role="toolbar" aria-label="Style controls">
  <div class="group" id="filters" role="radiogroup" aria-label="Letter style"></div>
  <div class="sep"></div>
  <div class="group" id="swatches" role="radiogroup" aria-label="Colors"></div>
  <div class="sep"></div>
  <button id="save" title="Save PNG" aria-label="Save PNG"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>PNG</button>
</div>

<script>
'use strict';

// ---------- small helpers ----------
const $ = s => document.querySelector(s);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const spr = (t, k = 8, w = 14) => t <= 0 ? 0 : 1 - Math.exp(-t * k) * Math.cos(t * w);
const eo = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3);
const TAU = Math.PI * 2;
function rng(seed) { let s = seed | 0; return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hx = h => { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
const mix = (a, b, t) => { const A = hx(a), B = hx(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); };
const rgba = (h, a) => { const [r, g, b] = hx(h); return `rgba(${r},${g},${b},${a})`; };
const lum = h => { const [r, g, b] = hx(h); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
const relLum = h => hx(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }).reduce((s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i], 0);
const contrast = (a, b) => { const A = relLum(a), B = relLum(b); return (Math.max(A, B) + 0.05) / (Math.min(A, B) + 0.05); };
const hash = n => { const x = Math.sin(n) * 43758.5453; return x - Math.floor(x); };

// ---------- palettes: pastel background, vibrant ink, accents, leaf, daisy petals, daisy centre, interface.
// Every pair was contrast-checked per filter: ink and riso colour ≥3:1 on the background, sticker colours ≥2.6:1 on white,
// foliage ≥3:1 on the background, petals clearly distinct from foliage, interface text ≥7:1. ----------
// Every pair below was contrast-checked per filter: main ink and riso colour ≥3:1 on the background, daisy foliage ≥2.5:1
// on the background and clearly distinct from every petal, sticker colours ≥2:1 against the white border, gummy colours
// ≥2.5:1 on the background, interface text ≥4.5:1. Gummy colours are always pastel (≈50% tint) yet stay clearly apart
// from the background and from each other.
const PALETTES = [
  { name: 'Noir', bg: '#0B0B0D', ink: '#FF3B2F', a: '#2EE6FF', b: '#FFD400', c: '#FF4FD8', leaf: '#2FBF5F', fol: '#1d763b', blooms: ['#FF3B2F', '#FFFFFF', '#FFD400', '#FF4FD8'], center: '#FF9F00', gummy: ['#a1f4ff', '#ffec8c', '#ffb0ed'], ui: '#F4F4F4' },
  { name: 'Paper', bg: '#F4EFE4', ink: '#2337E6', a: '#FF3A1F', b: '#FFB000', c: '#00A374', leaf: '#2E8B4A', fol: '#246c3a', blooms: ['#FF3A1F', '#FFFFFF', '#FFB000', '#6F9BFF'], center: '#FF8A00', gummy: ['#919bf2', '#ff9c8f', '#ffd880'], ui: '#1C1C2A' },
  { name: 'Coffee', bg: '#BF654A', ink: '#FFF1DC', a: '#2B140C', b: '#FFC94D', c: '#1C2F8C', leaf: '#2F6B3E', fol: '#15381F', blooms: ['#FFF1DC', '#FFC94D', '#FFB3C7', '#FFFFFF'], center: '#E8871E', gummy: ['#ffe4a6', '#8e97c6', '#ffd9e3'], ui: '#120502' },
  { name: 'Butter', bg: '#FFE38A', ink: '#E3002B', a: '#1338FF', b: '#FF5A00', c: '#008F5A', leaf: '#1E7A40', fol: '#175f32', blooms: ['#E3002B', '#FFFFFF', '#5C8DFF', '#FF6A00'], center: '#FFB000', gummy: ['#f18095', '#899cff', '#80c7ac'], ui: '#2A1A00' },
  { name: 'Moss', bg: '#123D2B', ink: '#FF8FC0', a: '#FFE14D', b: '#FF6B3D', c: '#B9A4FF', leaf: '#5FCF7F', fol: '#3b804f', blooms: ['#FF8FC0', '#FFFFFF', '#FFE14D', '#B9A4FF'], center: '#FF9F00', gummy: ['#fff2af', '#ffbca8', '#e0d6ff'], ui: '#F3F1E6' },
  { name: 'Blush', bg: '#FFD1DC', ink: '#E0004C', a: '#1B2BFF', b: '#7A00E6', c: '#008F5A', leaf: '#1E8045', fol: '#176436', blooms: ['#E0004C', '#FFFFFF', '#6F8BFF', '#FFB800'], center: '#FF8A00', gummy: ['#8d95ff', '#80c7ac', '#ffdc80'], ui: '#3A0A1A' },
  { name: 'Cobalt', bg: '#1C35F0', ink: '#FFE14D', a: '#FF9AD0', b: '#FF3B30', c: '#9B5CFF', leaf: '#5BE38E', fol: '#2BC46A', blooms: ['#FFE14D', '#FFFFFF', '#FF4FA3', '#FF3B30'], center: '#FF6A00', gummy: ['#fff2af', '#ffa7a2', '#d2b6ff'], ui: '#F5F7FF' },
  { name: 'Lilac', bg: '#D8C8FF', ink: '#D93600', a: '#1D2BE0', b: '#E6007E', c: '#008F6A', leaf: '#1A8A4C', fol: '#146c3b', blooms: ['#FF4A12', '#FFFFFF', '#FFCF00', '#E6007E'], center: '#FF7A00', gummy: ['#ec9a80', '#80c7b4', '#ffe780'], ui: '#24124F' },
  { name: 'Plum', bg: '#2A0B3D', ink: '#39F0D0', a: '#FF5FD2', b: '#FFE14D', c: '#FF7A3D', leaf: '#3FD47A', fol: '#27834c', blooms: ['#FF8A3D', '#FFFFFF', '#FFE14D', '#FF5FD2'], center: '#FF9F00', gummy: ['#a6f8ea', '#ffb7eb', '#fff2af'], ui: '#F7EEFF' }
];
// derived colours, computed once per palette
PALETTES.forEach(P => {
  P.leafShades = [P.leaf, mix(P.leaf, '#000000', 0.22), mix(P.leaf, '#ffffff', 0.2)].map(c => [c, mix(c, '#000000', 0.14)]);
  P.centers = P.blooms.map(b => Math.abs(lum(b) - lum(P.center)) < 0.08 ? mix(P.center, '#000000', 0.3) : P.center);
  const four = [P.ink, P.a, P.b, P.c];
  P.sticker = four.filter(c => contrast(c, '#ffffff') >= 2); if (!P.sticker.length) P.sticker = [P.ink];
});

// ---------- filters ----------
const FILTERS = [
  { id: 'bloom',   name: 'Daisies',     font: 'Titan One',     w: 400, scale: 1,    track: 1.08, kind: 'vec' },
  { id: 'inflate', name: 'Inflated',    font: 'Bagel Fat One', w: 400, scale: 1,    track: 1.03, kind: 'spr', pop: 'pop' },
  { id: 'gummy',   name: 'Gummy',       font: 'Sniglet',       w: 800, scale: 1.02, track: 1.02, kind: 'spr', pop: 'wobble', cycle: 'gummy' },
  { id: 'sticker', name: 'Sticker',     font: 'Rubik',         w: 900, scale: 1,    track: 1.12, kind: 'spr', pop: 'slap', cycle: 'sticker' },
  { id: 'neon',    name: 'Neon pixel',  font: 'Silkscreen',    w: 400, scale: 1.3,  track: 1.0,  kind: 'vec' },
  { id: 'riso',    name: 'Risograph',   font: 'Archivo Black', w: 400, scale: 1,    track: 1.02, kind: 'spr', pop: 'pop' }
];
const FB = Object.fromEntries(FILTERS.map(f => [f.id, f]));
// try other inflated fonts from any Google Font name: type-charms.html?inflate=Coiny  (add &weight=800 for weighted fonts)
const QS = new URLSearchParams(location.search);
if (QS.get('inflate')) {
  FB.inflate.font = QS.get('inflate'); FB.inflate.w = +(QS.get('weight') || 400);
  const ln = document.createElement('link'); ln.rel = 'stylesheet';
  ln.href = `https://fonts.googleapis.com/css2?family=${FB.inflate.font.trim().replace(/ +/g, '+')}:wght@${FB.inflate.w}&display=swap`;
  document.head.appendChild(ln);
}
const fstr = (f, px) => `${f.w} ${px}px "${f.font}", system-ui, sans-serif`;

// ---------- state ----------
const cv = $('#cv'), g = cv.getContext('2d'), kb = $('#kb');
const meas = mk(4, 4).getContext('2d');
let W = 0, H = 0, dpr = 1;
let fi = 0, pi = 0;
let letters = [], uid = 1, lastKey = -1e9, everTyped = false;
let St = 100, Sd = 100, emptyS = 100;
let cx = 0, cy = 0, tcx = 0, tcy = 0, cH = 60, tcH = 60, lt = 0;
const FIL = () => FILTERS[fi], PAL = () => PALETTES[pi];
const SENT = '​';

// ---------- metrics ----------
const advC = new Map();
function adv(f, ch) {
  if (ch === ' ') return 0.3;
  const k = f.id + ch;
  if (advC.has(k)) return advC.get(k);
  let w;
  { meas.font = fstr(f, 100); w = meas.measureText(ch).width / 100 * f.scale; }
  advC.set(k, w);
  return w;
}
const dockH = () => { const d = $('#dock'); return d ? d.getBoundingClientRect().height : 120; };

// ---------- layout ----------
function layout(snap) {
  if (!W) return;
  const f = FIL(), A = letters.filter(l => !l.dead);
  const top = $('#top').getBoundingClientRect().bottom + 28, bot = dockH() + 36, availH = Math.max(120, H - top - bot), maxW = W * 0.86;
  const S0 = Math.min(availH * 0.52, W * 0.32, 300);
  emptyS = S0;
  const ws = A.map(l => adv(f, l.ch) * (l.ch === ' ' ? 1 : f.track));
  const words = []; let cur = null;
  A.forEach((l, i) => {
    if (l.ch === ' ') { if (cur) { words.push(cur); cur = null; } words.push({ sp: 1, idx: [i] }); }
    else { if (!cur) cur = { idx: [] }; cur.idx.push(i); }
  });
  if (cur) words.push(cur);
  const lineW = (li, S) => { let e = li.length; while (e > 0 && A[li[e - 1]].ch === ' ') e--; let w = 0; for (let k = 0; k < e; k++) w += ws[li[k]]; return w * S; };
  const wrap = S => {
    const lines = [[]]; let lw = 0;
    for (const w of words) {
      const ww = w.idx.reduce((s, i) => s + ws[i], 0) * S;
      if (!w.sp && lw > 0 && lw + ww > maxW) { lines.push([]); lw = 0; }
      lines[lines.length - 1].push(...w.idx); lw += ww;
    }
    return lines;
  };
  let lines = [A.map((_, i) => i)];
  const unit = lineW(lines[0], 1);
  let S = unit > 0 ? Math.min(S0, maxW / unit) : S0;
  if (words.filter(w => !w.sp).length > 1 && S < availH * 0.22) {
    let lo = availH * 0.04, hi = S0;
    for (let k = 0; k < 24; k++) {
      const mid = (lo + hi) / 2, ls = wrap(mid);
      if (ls.every(li => lineW(li, mid) <= maxW) && ls.length * 1.3 * mid <= availH) lo = mid; else hi = mid;
    }
    const ls = wrap(lo);
    if (ls.length > 1 && lo > S) { S = lo; lines = ls; }
  }
  const n = lines.length, lh = 1.3 * S, mid = top + availH / 2;
  lines.forEach((li, k) => {
    let x = W / 2 - lineW(li, S) / 2;
    const y = mid + (k - (n - 1) / 2) * lh + 0.33 * S;
    li.forEach(i => { const l = A[i], w = ws[i] * S; l.tx = x + w / 2; l.ty = y; l.tw = w; x += w; });
  });
  St = S;
  const last = A[A.length - 1];
  if (last) { tcx = last.tx + last.tw / 2 + 0.06 * S; tcy = last.ty - 0.35 * S; tcH = 0.82 * S; }
  else { tcx = W / 2; tcy = mid; tcH = Math.min(S0 * 0.55, 110); }
  A.forEach(l => { if (l.x == null) { l.x = l.tx; l.y = l.ty; } });
  if (snap) { Sd = St; cx = tcx; cy = tcy; cH = tcH; A.forEach(l => { l.x = l.tx; l.y = l.ty; }); }
  nudge();
}

// ---------- raster helpers ----------
function maskText(f, ch, fs, w, h, bx, by, stroke) {
  const c = mk(w, h), x = c.getContext('2d');
  x.font = fstr(f, fs); x.textAlign = 'center'; x.textBaseline = 'alphabetic'; x.fillStyle = '#000';
  x.fillText(ch, bx, by);
  if (stroke) { x.lineJoin = 'round'; x.lineWidth = stroke; x.strokeStyle = '#000'; x.strokeText(ch, bx, by); }
  return c;
}
function tint(M, col) {
  const c = mk(M.width, M.height), x = c.getContext('2d');
  x.drawImage(M, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);
  return c;
}
// soft light or shade bleeding inward from the shape's edges (canvas shadows work in every browser, including Safari)
function innerShadow(M, dx, dy, blur, col) {
  const w = M.width, h = M.height, T = mk(w, h), t = T.getContext('2d');
  t.fillStyle = '#000'; t.fillRect(0, 0, w, h);
  t.globalCompositeOperation = 'destination-out'; t.drawImage(M, dx, dy);
  const U = mk(w, h), u = U.getContext('2d'), OFF = w + h + 200;
  u.shadowColor = col; u.shadowBlur = blur; u.shadowOffsetX = OFF;
  u.drawImage(T, -OFF, 0);
  u.shadowColor = 'transparent'; u.globalCompositeOperation = 'destination-in'; u.drawImage(M, 0, 0);
  return U;
}
// glossy highlight blobs placed in the roomiest top-left spots of a letter
function blobs(x, M, fs, al, sz, n) {
  const w = M.width, h = M.height, d = M.getContext('2d').getImageData(0, 0, w, h).data;
  const A = (px, py) => { px |= 0; py |= 0; return px < 0 || py < 0 || px >= w || py >= h ? 0 : d[(py * w + px) * 4 + 3]; };
  const st = Math.max(2, Math.round(fs * 0.022)), rr = fs * 0.075, cand = [];
  for (let py = 0; py < h; py += st) for (let px = 0; px < w; px += st) {
    if (A(px, py) < 200) continue;
    let ok = true;
    for (let k = 0; k < 8 && ok; k++) { const a = k * Math.PI / 4; if (A(px + Math.cos(a) * rr, py + Math.sin(a) * rr) < 200) ok = false; }
    if (ok) cand.push([px, py]);
  }
  if (!cand.length) return;
  cand.sort((p, q) => (p[1] + p[0] * 0.3) - (q[1] + q[0] * 0.3));
  const picks = [cand[0]];
  for (const c of cand) { if (picks.length >= n) break; if (picks.every(p => Math.hypot(p[0] - c[0], p[1] - c[1]) > fs * 0.42)) picks.push(c); }
  x.fillStyle = rgba('#ffffff', al);

// ---------- typing ----------
function add(ch) {
  if (letters.filter(l => !l.dead).length >= 60) return;
  const now = performance.now(); lastKey = now; everTyped = true;
  const ci = letters.filter(l => !l.dead && l.ch !== ' ').length;
  letters.push({ ch, id: uid++, birth: now, ci, tilt: (Math.random() - 0.5) * 0.16 });
  layout(); $('#hint').classList.add('quiet');
}
function back() {
  const now = performance.now(); lastKey = now;
  const A = letters.filter(l => !l.dead), last = A[A.length - 1];
  if (last) { last.dead = now; layout(); }
}
function clearAll() {
  const now = performance.now(); lastKey = now;
  letters.forEach(l => { if (!l.dead) l.dead = now; }); layout();
}
function nudge() {
  const n = $('#nudge'), empty = !letters.some(l => !l.dead);
  n.classList.toggle('off', !empty);
  if (empty) n.style.top = (tcy + tcH / 2 + 26) + 'px';
}
window.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey) { if (e.key.toLowerCase() === 's') { e.preventDefault(); savePNG(); } return; }
  if (e.altKey) return;
  const t = e.target;
  if (t && t.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
  if (e.key === 'Backspace') { e.preventDefault(); back(); return; }
  if (e.key === 'Enter') { e.preventDefault(); clearAll(); return; }
  if (e.key.length !== 1) return;
  e.preventDefault(); add(e.key);
});
// phone keyboards often skip key events and write into the hidden field instead
kb.value = SENT;
kb.addEventListener('input', e => {
  const it = e.inputType || '';
  if (it.startsWith('delete')) back();
  else if (it === 'insertLineBreak' || it === 'insertParagraph') clearAll();
  else if (e.data) for (const ch of e.data) ch === '\n' ? clearAll() : add(ch);
  kb.value = SENT;
});
cv.addEventListener('click', () => kb.focus({ preventScroll: true }));

// ---------- dock ----------
function buildDock() {
  const fr = $('#filters'), sr = $('#swatches');
  FILTERS.forEach((f, i) => {
    const b = document.createElement('button');
    b.className = 'tile'; b.title = f.name; b.setAttribute('aria-label', f.name); b.setAttribute('role', 'radio');
    b.appendChild(document.createElement('canvas'));
    b.addEventListener('click', () => { setFilter(i); b.blur(); });
    fr.appendChild(b);
  });
  PALETTES.forEach((P, i) => {
    const b = document.createElement('button');
    b.className = 'sw'; b.title = P.name; b.setAttribute('aria-label', P.name); b.setAttribute('role', 'radio');
    const dot = document.createElement('span'); dot.style.background = `linear-gradient(135deg, ${P.bg} 50%, ${P.ink} 50%)`; b.appendChild(dot);
    b.addEventListener('click', () => { setPalette(i); b.blur(); });
    sr.appendChild(b);
  });
  $('#save').addEventListener('click', e => { savePNG(); e.currentTarget.blur(); });
}
function drawTiles() {
  const P = PAL();
  document.querySelectorAll('.tile').forEach((b, i) => {
    const f = FILTERS[i], c = b.querySelector('canvas'), r = b.getBoundingClientRect();
    const cw = r.width || 58, ch = r.height || 44;
    c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr);
    const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, cw, ch);
    const L = [{ ch: 'A', id: -11 - i * 2, ci: 0, tilt: -0.06 }, { ch: 'a', id: -12 - i * 2, ci: 1, tilt: 0.06 }];
    const ws = L.map(l => adv(f, l.ch) * f.track), tot = ws[0] + ws[1];
    const S = Math.min(ch * 0.66, (cw - 10) / tot);
    let xx = cw / 2 - tot * S / 2; const y = ch / 2 + 0.33 * S;
    L.forEach((l, k) => {
      const lx = xx + ws[k] * S / 2;
      x.save();
      if (f.id === 'sticker') { x.translate(lx, y - 0.35 * S); x.rotate(l.tilt); x.translate(-lx, -(y - 0.35 * S)); }
      drawLetter(x, l, lx, y, S, f, P, dpr, 1e9);
      x.restore(); xx += ws[k] * S;
    });
    b.classList.toggle('on', i === fi); b.setAttribute('aria-checked', i === fi);
  });
  document.querySelectorAll('.sw').forEach((b, i) => { b.classList.toggle('on', i === pi); b.setAttribute('aria-checked', i === pi); });
}
function setFilter(i) {
  if (i === fi) return;
  fi = i;
  const now = performance.now();
  letters = letters.filter(l => !l.dead);
  letters.forEach((l, k) => { l.birth = now + k * 35; });
  layout(true); drawTiles();
}
function setPalette(i) {
  pi = i; const P = PAL(), r = document.documentElement.style;
  r.setProperty('--bg', P.bg); r.setProperty('--ink', P.ui); r.setProperty('--line', rgba(P.ui, 0.28));
  drawTiles();
}

// ---------- export ----------
function savePNG() {
  const pr = Math.max(2, dpr), c = mk(W * pr, H * pr);
  paint(c.getContext('2d'), pr, performance.now(), true);
  const word = letters.filter(l => !l.dead).map(l => l.ch).join('').trim().replace(/[^a-z0-9]+/gi, '-').toLowerCase().slice(0, 24) || 'type';
  c.toBlob(b => {
    if (!b) return;
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `${word}-${FIL().id}.png`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
}

// ---------- boot ----------
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  layout(true); drawTiles();
}
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now(), dt = Math.min(64, now - (lt || now)); lt = now;
  const k = 1 - Math.exp(-dt / 90);
  Sd += (St - Sd) * k; cx += (tcx - cx) * k; cy += (tcy - cy) * k; cH += (tcH - cH) * k;
  for (const l of letters) if (!l.dead && l.tx != null) { l.x += (l.tx - l.x) * k; l.y += (l.ty - l.y) * k; }
  letters = letters.filter(l => !(l.dead && now - l.dead > 260));
  paint(g, dpr, now, false);
}
buildDock();
setPalette(0);
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
if (!matchMedia('(pointer: coarse)').matches) setTimeout(() => kb.focus({ preventScroll: true }), 60);
if (document.fonts) {
  Promise.all(FILTERS.filter(f => f.font).map(f => document.fonts.load(`${f.w} 40px "${f.font}"`))).then(() => {
    advC.clear(); PC.clear(); SC.clear(); layout(true); drawTiles();
  }).catch(() => {});
}
// ---------- visitor number: each browser gets its own number once, then keeps it ----------
(async () => {
  const el = $('#count'), KEY = 'letterpop-visitor';
  const show = n => { el.querySelector('b').textContent = `you're visitor #${Number(n).toLocaleString('en-US')}`; el.hidden = false; layout(); };
  let mine = null;
  try { mine = localStorage.getItem(KEY); } catch (e) {}
  if (mine) { show(mine); return; }
  if (location.protocol === 'file:') return;            // opened from your computer: no counter to talk to
  try {
    const r = await fetch('/api/visit', { method: 'POST' });
    if (!r.ok) return;
    const { visitor } = await r.json();
    if (!visitor) return;
    try { localStorage.setItem(KEY, String(visitor)); } catch (e) {}
    show(visitor);
  } catch (e) {}
})();
window.__tc = { add, clearAll, setFilter, setPalette, savePNG, get letters() { return letters; } };
</script>
